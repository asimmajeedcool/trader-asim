name: Trader Asim Chat ID Check

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Find Telegram chat
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          curl -sS \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getUpdates"
